name: EnderBow
main: com.voxel.enderbow.EnderBowPlugin
version: 1.0.0
api-version: "1.21"
description: Allows a hub bow to shoot ender pearls instead of arrows (configurable).
commands:
  enderbow:
    description: EnderBow admin command
    usage: /enderbow <reload|give>
permissions:
  enderbow.reload:
    description: Reload EnderBow config
    default: op
  enderbow.give:
    description: Give a player the EnderBow
    default: op
  enderbow.bypass:
    description: Bypass EnderBow cooldown
    default: false
