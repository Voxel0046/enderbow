# EnderBow configuration
# name: display name of the custom bow (supports & color codes)
name: "&5Ender Bow"

# lore: list of lore lines (supports & color codes)
lore:
  - "&7Shoot an ender pearl instead of an arrow"
  - "&eNo pearls required"

# slot: hotbar slot where the bow will be placed (0-8)
slot: 4

# give-on-join: give the bow to players when they join
give-on-join: true

# cooldown-seconds: per-player cooldown between uses (seconds, fractional allowed)
cooldown-seconds: 2.0

# unbreakable: if true, the custom bow will not take durability damage
unbreakable: true
